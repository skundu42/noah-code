[project]
name = "noah-code"
version = "0.2.3"
description = "Noah Code terminal coding agent, built on NVIDIA OO Agents (NOOA)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "noah-code contributors" }]
keywords = ["agents", "coding", "nooa", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "nooa==0.0.9",
    "nooa-cli==0.0.9",
    # Newer LiteLLM releases currently omit macOS wheels and require a Rust
    # build. Keep the public installer binary-only until upstream restores them.
    "litellm>=1.84.0,<1.92.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.0",
    "packaging>=24.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/skundu42/noah-code"
Documentation = "https://github.com/skundu42/noah-code#readme"
Repository = "https://github.com/skundu42/noah-code.git"
Issues = "https://github.com/skundu42/noah-code/issues"
Releases = "https://github.com/skundu42/noah-code/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
tui = [
    "textual>=1.0.0",
]
mcp = [
    "nooa[mcp]==0.0.9",
]
tracing = [
    "nooa[tracing]==0.0.9",
]

[project.scripts]
noah-code = "noah_code.cli:main"
nc = "noah_code.cli:main"
noah = "noah_code.cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noah_code"]

[tool.hatch.build.targets.wheel.force-include]
"src/noah_code/ui/textual.css" = "noah_code/ui/textual.css"
[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Keep the default suite hermetic; opt in with `pytest -m integration`.
addopts = ["-m", "not integration"]
markers = [
    "integration: tests that may touch the network (deselect by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/noah_code"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# NOOA's tool/skill framework stacks @hidden/@property and spec() decorators
# in ways mypy's plugin model does not describe; these codes are noise here.
disable_error_code = ["prop-decorator", "empty-body"]

[[tool.mypy.overrides]]
# nooa resolves attributes lazily (PEP 562) and litellm ships no stubs;
# treat every public surface as Any instead of half-analyzing sources.
module = ["nooa", "nooa.*", "nooa_cli", "nooa_cli.*", "litellm", "litellm.*"]
follow_imports = "skip"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260815",
]
