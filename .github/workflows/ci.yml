name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Lint and type check
        run: |
          uv run ruff check src tests scripts
          uv run mypy src/noah_code

      - name: Test with coverage
        run: |
          uv run pytest tests --cov=noah_code --cov-report=term-missing \
            --cov-fail-under=70 -W error::pytest.PytestUnraisableExceptionWarning

      - name: Build and smoke-test wheel install
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/noah-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/noah-bin
        run: |
          uv build --out-dir build-dist
          uv tool install --python 3.12 --no-build --with 'nooa[mcp,tracing]' build-dist/*.whl
          "${UV_TOOL_BIN_DIR}/noah" --version
